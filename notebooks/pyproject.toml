# The one environment every notebook runs in (docs/dev/notebooks.md). `node scripts/nb.mjs setup` builds it at the
# repo root's .venv; add a dependency HERE, never with a bare `uv pip install` (`uv sync` removes what is undeclared).
[project]
name = "wmlnb"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "ipykernel", "nbclient", "nbconvert", "nbformat",
    "numpy", "pandas", "scipy", "matplotlib",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wmlnb"]
