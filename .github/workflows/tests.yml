name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * *"   # nightly — for the non-blocking real-model sanity job below
  workflow_dispatch:

# One run per branch. Several sessions work this repo at once and each push used to queue a full
# matrix + e2e behind the last one, so the answer you were waiting for arrived minutes after it
# mattered. A superseded run is cancelled — except on main, where every commit's result is a record
# worth keeping.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Can this change POSSIBLY affect the browser jobs? They take five to fifteen minutes, and a markdown
  # edit cannot reach them — but a wrong answer here silently skips a real check, which is worse than
  # the minutes it saves. So the rule is: a skip must be POSITIVELY PROVEN, and everything else runs.
  #
  # Two things qualify. Prose (markdown, images, the agent skills), and `openwebui/**`, which is the
  # Python source of the OpenWebUI-side workspace tools: it is never bundled, never imported, and
  # nothing under tests/ or build.mjs reads it, so it cannot change what a browser does. Its own tests
  # are the `tools` job below, which runs either way.
  #
  # Three traps this repo has, all worth stating because the obvious version gets them wrong:
  #   - `docs/**` is NOT docs. docs/spec/export.schema.json is GENERATED and checked in, and
  #     tests/export-schema.test.mjs diffs it. Ignoring docs/ wholesale would let a stale contract land.
  #   - the workflow itself is not docs: a change to this file must run everything it describes.
  #   - `examples/**` is NOT excludable the way openwebui/ is: the e2e harness serves those pages, so
  #     a change to one is a change to what the browser jobs actually exercise.
  #
  # The decision is written to the run summary rather than being an invisible skip, so a job that did not
  # run says so on the page you are already looking at.
  # Every Linux job names `ubuntu-24.04` rather than `ubuntu-latest`, which moves to 26.04 from 2026-10-19 and
  # prints a notice on every job until then. Moving is then a one-line change made on purpose, with a CI run to
  # judge it by: Playwright's `--with-deps` and the Android SDK on the image are what would break first.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        run: |
          base=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            base="${{ github.event.before }}"
          fi
          # No base, or a base this clone does not have (a new branch pushes 000…0): assume CODE. Failing
          # open is the only safe default — the cost of being wrong that way is six minutes, and the cost
          # of being wrong the other way is a check that never ran.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "Ran everything: no comparable base for \`${{ github.event_name }}\`." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          files=$(git diff --name-only "$base" HEAD)
          # Prose, plus the OpenWebUI tool sources. Everything else — including any .json under
          # docs/ — counts as code. See the note above this job for why each entry is safe.
          other=$(echo "$files" | grep -vE '(\.md$|\.png$|\.jpe?g$|\.gif$|^\.claude/|^openwebui/)' || true)
          if [ -n "$files" ] && [ -z "$other" ]; then
            echo "code=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Nothing here can reach a browser — skipped \`e2e\` and \`bench\`"
              echo ""
              echo "Only prose and/or \`openwebui/\` Python changed, so the browser jobs cannot be affected. Files:"
              echo ""
              echo '```'
              echo "$files"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "Ran everything: $(echo "$other" | grep -c .) non-docs file(s) changed." >> "$GITHUB_STEP_SUMMARY"
          fi

  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # 22 + 24 are the Active LTS lines; 26 is Current (catches forward-compat). Node 20 was
        # dropped — it's EOL, and tsx loads a `.css` import via the CJS path there, which the
        # ESM-only css-null test stub can't intercept (Node 22+ keeps it on the ESM loader).
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Install devDeps (esbuild/typescript/jsdom). `npm test` runs `pretest`
      # (npm run build) first, so tests exercise the built dist/. TS type errors
      # are caught separately by `typecheck`. Live tests self-skip without keys.
      - run: npm ci
      - run: npm run typecheck
      # Fetch the python_exec wheels (numpy/pandas/… from the Pyodide CDN) so the real-CPython
      # tests in tests/python.test.js run instead of self-skipping. Cached by pyodide version +
      # package set, so the CDN is hit only when those change.
      - name: Cache pyodide wheels
        id: pyocache
        uses: actions/cache@v6
        with:
          path: pyodide-wheels
          key: pyodide-wheels-${{ hashFiles('package-lock.json', 'src/python-env.ts') }}
      - if: steps.pyocache.outputs.cache-hit != 'true'
        run: npm run fetch-pyodide
      - run: npm test
      # The legend word-clipping "visual test" notebook — regenerate and upload it even when the run
      # FAILED (if: always()), so a red clip-case can be reviewed by eye: download the artifact, open the
      # HTML, and the failing cell shows the words, the crop box, and expected-vs-actual. Named per matrix
      # leg (upload-artifact requires unique names).
      - name: Legend visual-test notebook
        if: always()
        run: node tools/preview-legend.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: legend-notebook-node${{ matrix.node }}
          path: tools/legend-notebook.html
      # On failure, surface the notebook on the run's SUMMARY page (markdown, hard to miss) — otherwise the
      # artifact is just listed at the bottom with nothing telling you it's the way to debug a red clip-case.
      - name: Point to the notebook on failure
        if: failure()
        run: |
          {
            echo "### ❌ Tests failed on Node ${{ matrix.node }}"
            echo ""
            echo "If a **legend** word-clipping case is red, download the **\`legend-notebook-node${{ matrix.node }}\`** artifact from this run (Artifacts, below) and open \`legend-notebook.html\` — the failing cell shows the words, the crop box, and expected-vs-actual. The assertion itself is in the \`npm test\` step log above."
          } >> "$GITHUB_STEP_SUMMARY"

  # Build the loadable extension and upload it, so users can grab a ready-to-load
  # dist/ from any run instead of building locally (the extension now needs a build).
  # The OpenWebUI workspace tools are Python and run inside someone else's server, so `npm test`
  # cannot see them at all. These drive the shipped files with `requests` and `pydantic` stubbed —
  # stdlib only, no install step, a couple of seconds — so the streaming contract has a check rather
  # than a deployment and a hope.
  tools:
    runs-on: ubuntu-24.04
    steps:
      # fetch-depth: 0 so the CSS ratchet below can diff against the merge base. Without it the checkout is
      # shallow, the base ref is missing, and the check SKIPS — quietly, which is the worst of both.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: python3 -m unittest discover -s openwebui/tests -v
      # The code index has to be able to FIND what a change adds, or the next person rebuilds it — this repo
      # has grown a duplicate pointer chip, a fourth drag grip and a second view-return signal exactly that
      # way, and the same happens to whole modules. No node_modules needed: it is plain node reading files.
      # The vendored schemas and vectors are not ours: they live beside the Rust that produces them, and a copy
      # that drifted is a wrong decoder that still compiles. Offline here, by git blob id. The `--upstream` poll
      # (which says when the upstream BRANCH has moved past what we hold) is for a person to run, not CI: upstream
      # moving on is news rather than a fault, and a check that fails for news is one people learn to skip.
      - name: The vendored schemas are the files they are pinned to
        run: node scripts/check-pins.mjs

      - name: Every source file says what it is for
        run: node scripts/index.mjs --headerless
      # The index is only useful while it is cheap enough to run without thinking about it. This measures a COLD
      # build (CI never has the cache) against a budget the tool owns, warns on the diff well before the hard cap,
      # and fails only on a change in KIND — see SPEED_WARN_MS in scripts/index.mjs for the measurement behind both.
      - name: The code index is still fast
        run: node scripts/index.mjs --check-speed
      # A RATCHET, not a rule: 178 existing exports and 300+ existing CSS classes have no docstring, and a
      # check that ships red is one people learn to scroll past. Only what a PR ADDS is asked about.
      # JSDoc is PROSE to the TypeScript compiler in a .ts file — @param names and types are never checked. This
      # repo cares more than most, because contract.ts's JSDoc is lifted verbatim into what the MODEL reads.
      # `core` is DERIVED — every test file no genre claims — which is the right direction and has one failure: a
      # subsystem grows there file by file until running "just the hub tests" means running a hundred and twenty
      # three. Mechanical so it cannot be argued with: four files sharing a name prefix are a subject.
      - name: No subsystem is hiding in the core genre
        run: node scripts/test.mjs --check-genres
      # The same ratchet for TESTS, and for the same reason one level along: the tests are where the knowledge
      # about behaviour lives, and the biggest file holds 407 of them behind ten section comments — which makes
      # "is this already covered?" a 150k-token question. Only what a PR ADDS is asked about; 1,826 existing tests
      # sit under no section and a check that ships red is one people learn to scroll past.
      - name: Every test this PR adds says what it is about
        run: |
          base=$(git merge-base HEAD "origin/${GITHUB_BASE_REF:-main}" 2>/dev/null || echo "")
          if [ -z "$base" ]; then echo "no merge base — skipping the ratchet"; exit 0; fi
          node scripts/test-index.mjs --new "$base"
      - name: The documentation this PR touches matches the code
        run: |
          base=$(git merge-base HEAD "origin/${GITHUB_BASE_REF:-main}" 2>/dev/null || echo "")
          if [ -z "$base" ]; then echo "no merge base — skipping"; exit 0; fi
          node scripts/check-jsdoc.mjs --new "$base"
      - name: Everything this PR adds is documented
        run: |
          # No extra fetch: `fetch-depth: 0` above already has every ref, and a `--depth=1` fetch here would
          # SHALLOW the base ref and break the merge-base it exists to find.
          base=$(git merge-base HEAD "origin/${GITHUB_BASE_REF:-main}" 2>/dev/null || echo "")
          if [ -z "$base" ]; then echo "no merge base — skipping the ratchet"; exit 0; fi
          node scripts/index.mjs --new "$base"
      # A REMINDER, never a gate — it exits 0 whatever it finds, and lands as ::warning annotations on the
      # diff rather than as a line in a log. Ratcheted for the same reason as the CSS check above: fifteen
      # files are already over the limit, so listing them every run would train people to ignore it. It
      # speaks only when a change makes an oversized file bigger.
      - name: Oversized source files (reminder only)
        run: |
          base=$(git merge-base HEAD "origin/${GITHUB_BASE_REF:-main}" 2>/dev/null || echo "")
          if [ -z "$base" ]; then echo "no merge base — skipping the file-size reminder"; exit 0; fi
          node scripts/check-file-size.mjs "$base"

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The artifact must include the python_exec runtime (dist/pyodide/) or the loaded extension
      # can't run python_exec — build.mjs copies pyodide-wheels/ in, so fetch them first.
      - name: Cache pyodide wheels
        id: pyocache
        uses: actions/cache@v6
        with:
          path: pyodide-wheels
          key: pyodide-wheels-${{ hashFiles('package-lock.json', 'src/python-env.ts') }}
      - if: steps.pyocache.outputs.cache-hit != 'true'
        run: npm run fetch-pyodide
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: window-ml-extension
          path: dist/
      # The hosted client (dist-app/): the same standalone client, with a manifest, icons and a service worker, so a
      # phone can put it on its home screen and open it offline. It is uploaded on every run as a Pages artifact, and
      # published by the job below only from main.
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-app/

  # THE HOSTED CLIENT, on GitHub Pages. This is how a device that cannot run the packaged app gets one — an iPad, where
  # Apple gives a free signing certificate seven days and no more, and any desktop browser. It is the same client the
  # phone app runs in its WebView, so there is no second implementation to drift.
  #
  # It serves no secrets and holds none: the keys are made in the browser that installs it and never leave it, and the
  # page is inert until someone pairs it with a hub. What it is, therefore, is a static copy of open-source code at a
  # stable address, which is what Pages is for.
  pages:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    # One deployment at a time, and never cancelled: two commits landing on main together would otherwise race to
    # publish, and the loser could be the newer one.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  # End-to-end: load the BUILT extension in a real Chromium (Playwright) and drive the actual pipeline
  # (background loop → tool delegation → page) against a scripted fake-LLM — deterministic, no Ollama.
  # Kept minimal on purpose (real browsers are slow); only behaviour that genuinely needs a browser
  # lives here (see CLAUDE.md "End-to-end tests"). Everything else is in the fast `test` job above.
  # SHARDED across three jobs, each with the config's three workers: the suite is ~30 minutes of test time, and
  # one job took ~11 minutes of wall time on every PR. Playwright splits by TEST (fullyParallel), so the two
  # heavy specs (resource-panel, bench-dock) spread across shards instead of pinning one; a spec pinned with
  # `mode: "default"` stays whole on one shard. `fail-fast: false` so one red shard does not cancel the others'
  # report — the failures you need to read may be in all three.
  e2e-shard:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    name: e2e (${{ matrix.shard }}/3)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      # The wheels the built dist/ needs for python_exec. Without them the extension loads but a python
      # step dies with `No module named 'numpy'`, so python-stream.spec.mjs failed on every run — it does
      # NOT self-skip the way the node CPython tests do, because a browser test cannot know why the
      # sandbox is empty. Cached exactly as the `test` job caches it.
      - name: Cache pyodide wheels
        id: pyocache
        uses: actions/cache@v6
        with:
          path: pyodide-wheels
          key: pyodide-wheels-${{ hashFiles('package-lock.json', 'src/python-env.ts') }}
      - if: steps.pyocache.outputs.cache-hit != 'true'
        run: npm run fetch-pyodide
      # `test:e2e` runs `pretest:e2e` (npm run build) first, so it exercises the built dist/. The harness is
      # headless now (full Chromium in --headless=new); xvfb stays as a safety net for anything that asks
      # for a window (the narrated demos, E2E_HEADFUL=1) so such a run fails on its assertion, not on DISPLAY.
      - name: Run E2E
        run: xvfb-run -a npm run test:e2e -- --shard=${{ matrix.shard }}/3
      # What a failing test SAW: Playwright's error-context snapshot of the page, its trace and screenshots. Without it
      # a failure that only reproduces on CI is guesswork (the addresses test failed #235 three times and passed on
      # this Mac every time). `gh run download <run> -n e2e-results-<shard>` fetches it.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  # ONE `e2e` status for the three shards, so a PR still has a single e2e check to read (and to require, if the
  # branch is ever protected). Skipped with the shards when no code changed; red if any shard was not green.
  e2e:
    needs: [changes, e2e-shard]
    if: always() && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: All shards passed
        run: |
          echo "shards: ${{ needs.e2e-shard.result }}"
          test "${{ needs.e2e-shard.result }}" = "success"

  # The BENCH's own instrument check — separate from `test`/`e2e` so a failure names the right thing. A
  # broken measurement tool is not a broken extension, and reading "e2e failed" sends you to look at the
  # wrong code. It also runs the bench CLI end to end, which nothing else does: the unit tests cover the
  # extractors and the e2e spec covers real event streams, but only this exercises spec loading, matrix
  # expansion, the cache, the sinks and the written report together.
  #
  # `smoke.bench.ts` is scripted so every reading is known before it runs (a run that retypes must read
  # 1.00, one that cites 0.00, one whose re-emission is in a SEEDED turn 0.00); check-calibration.mjs
  # asserts exactly those. Deterministic — fake-LLM, no model, no key. Headful under xvfb like the e2e job.
  bench:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Calibrate the bench
        run: xvfb-run -a npm run bench:calibrate
      - name: Upload the sweep
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-smoke-sweep
          path: tests/e2e/artifacts/bench/smoke/
          retention-days: 7

  # THE PHONE APP IS BUILT HERE, never on a contributor's machine. The moment the suite depends on Android Studio or
  # Xcode, a one-line change to the chat page needs 40GB of tooling and the people who would make that change stop
  # making it. The app is `mobile/` (docs/spec/NATIVE_SHELL.md); its gradle and Xcode projects are generated by
  # `expo prebuild` from app.json and the plugins, so there is no native project in the repo to review.
  #
  # This is a BUILD check, not a test: it answers "does the app still package", which is the failure that would
  # otherwise be found at release time. What the app DOES is checked where it can be — the page's own suites, the
  # bridge's unit tests, and the Maestro flows in tests/mobile/ against a device someone has.
  mobile-android:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    # To re-point the rolling `android-latest` release at the APK this job just built. Every other job here reads.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      # 17 is the JDK React Native's gradle plugin targets; a newer default breaks the build before it compiles.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      # `packages: ""` because the action's DEFAULT list still names `tools`, which Google removed — the job dies on
      # "Failed to find package 'tools'" before it has built anything. The runner image already ships an Android SDK;
      # all this step has to do is point the environment at it, and gradle resolves the rest from the project.
      - uses: android-actions/setup-android@v4
        with:
          packages: ""
      - run: npm ci
      - run: npm ci
        working-directory: mobile
      # The page the WebView loads, built and synced in: without it the app compiles around an empty generated file.
      - run: node scripts/build-web.mjs
      - run: node mobile/scripts/sync-embed.mjs
      - name: Generate the native project
        run: npx expo prebuild --platform android --no-install
        working-directory: mobile
      # Debug, and every ABI the project lists: this answers "does it package", and a release build's minification and
      # single-ABI trim are what `scripts/android.mjs install` does on a machine with a device to put it on.
      - name: Assemble the debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: mobile/android
      - uses: actions/upload-artifact@v7
        with:
          name: window-ml-android-debug
          path: mobile/android/app/build/outputs/apk/debug/*.apk
      # A debug APK expects Metro to be serving the JS, so it is a packaging check and nothing you can put on a phone.
      # The one you can is this: the JS bundled in, minified, and trimmed to arm64-v8a — every phone made in the last
      # decade, and a quarter of the native build. It is signed with the standard Android DEBUG key that `expo
      # prebuild` writes, which is all a sideload needs; the consequence is that it cannot replace an install under
      # this id signed with any other key, which has to be uninstalled first.
      #
      # Only on main and on demand: it adds minutes to a job every PR pays for, and what a PR needs answered is
      # whether the app still packages, which the debug build above already answers.
      - name: Assemble the release APK
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
        working-directory: mobile/android
      # Published as a RELEASE ASSET, not a build artifact: an artifact is a zip behind a GitHub login, and a phone
      # downloading it with one tap is the whole point. One rolling tag, deleted and remade so it points at the commit
      # the APK was actually built from rather than lying about it.
      - name: Publish it as the rolling Android build
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv mobile/android/app/build/outputs/apk/release/app-release.apk window-ml.apk
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest window-ml.apk --prerelease --target "$GITHUB_SHA" \
            --title "Android build (rolling)" --notes "$(cat <<'EOF'
          The phone app, built from the newest commit on main. Download `window-ml.apk` on the phone and open it;
          Android will ask whether the browser may install apps.

          Signed with the standard Android debug key, so it is for trying the app out rather than for distribution.
          An app already installed under `dev.wander.windowml` from another source has to be uninstalled first.

          arm64-v8a only.
          EOF
          )"

  # iOS needs a macOS runner, which is an order of magnitude dearer per minute, and the thing it catches is a
  # packaging break rather than a behaviour one. So it runs nightly and on demand rather than on every PR, the same
  # bargain the real-model job makes: the cost is a break found within a day instead of within a push.
  mobile-ios:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: mobile
      - run: node scripts/build-web.mjs
      - run: node mobile/scripts/sync-embed.mjs
      - name: Generate the native project
        run: npx expo prebuild --platform ios
        working-directory: mobile
      # No signing: a simulator build is what answers "does it package", and a device build would need a
      # certificate this repo deliberately does not hold.
      - name: Build for the simulator
        run: |
          xcodebuild -workspace windowml.xcworkspace -scheme windowml \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
        working-directory: mobile/ios

  # Non-blocking sanity check against a REAL, free, OpenAI-shaped model (default: Groq). NOT a gate — a real
  # model is non-deterministic + rate-limited, so it runs only on demand / nightly and never fails the
  # pipeline (continue-on-error). Enabled by the repo SECRET `GROQ_API_KEY_FREE` (a free Groq API key);
  # override endpoint/model with repo VARIABLES `E2E_REAL_BACKEND` / `E2E_REAL_MODEL` for any other
  # OpenAI-compatible provider. Without the secret the job self-skips. (GitHub Models was the natural fit but
  # is being retired — verified: its API now 410s a "retirement brownout".)
  e2e-real-model:
    runs-on: ubuntu-24.04
    continue-on-error: true
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Gate on a configured key
        id: gate
        run: echo "have_key=${{ secrets.GROQ_API_KEY_FREE != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.gate.outputs.have_key == 'true'
        run: npx playwright install --with-deps chromium
      - name: E2E against a real (free) model
        if: steps.gate.outputs.have_key == 'true'
        env:
          E2E_BACKEND: ${{ vars.E2E_REAL_BACKEND || 'https://api.groq.com/openai/v1/chat/completions' }}
          E2E_MODEL: ${{ vars.E2E_REAL_MODEL || 'openai/gpt-oss-20b' }}   # llama-3.3 emitted malformed tool calls; gpt-oss complies
          E2E_KEY: ${{ secrets.GROQ_API_KEY_FREE }}
        # ONLY the @real-ok tests. Everything else in the suite scripts the model — it sets an exact turn
        # sequence and reads fake.calls() back — so it either skips (cross-page's beforeEach) or, like
        # python-stream, starts its own fake and tests something a real model has no bearing on. Running
        # them here cost four minutes to learn nothing, and python-stream additionally failed for want of
        # the pyodide wheels this job has no reason to fetch. What remains is the two tests that actually
        # exercise a real model end to end.
        run: xvfb-run -a npm run test:e2e -- --grep "@real-ok"
      - uses: actions/upload-artifact@v7
        if: always() && steps.gate.outputs.have_key == 'true'
        with:
          name: e2e-real-model-artifacts
          path: test-results/
