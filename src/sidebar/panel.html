<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body { margin: 0; height: 100%; background: #1b1b1f; color: #a1a1aa;
                 font: 13px/1.6 system-ui, -apple-system, sans-serif; }
    #app { border: 0; width: 100%; height: 100vh; display: block; }
    /* Shown instead of the app when this panel isn't the active debug surface (debug is
       off, or it's rendering in the in-page sidebar) — the tab can't be un-registered, so
       it explains itself rather than sitting as a misleading empty log. */
    #ml-offnote { display: none; box-sizing: border-box; height: 100vh; padding: 40px 28px;
                  max-width: 460px; margin: 0 auto; }
    #ml-offnote h2 { color: #e4e4e7; font-size: 15px; margin: 0 0 8px; }
    #ml-offnote code { background: #27272a; border-radius: 4px; padding: 1px 5px; color: #e4e4e7; }
    #ml-lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: grid;
                   place-items: center; z-index: 9; cursor: zoom-out; outline: none; }
    #ml-lightbox img { max-width: 96vw; max-height: 96vh; }
  </style>
</head>
<body>
  <iframe id="app" src="sidebar.html" allow="clipboard-write"></iframe>
  <div id="ml-offnote"><h2 id="ml-offnote-h"></h2><div id="ml-offnote-b"></div></div>
  <script src="panel.js"></script>
</body>
</html>
