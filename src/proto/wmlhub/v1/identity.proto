syntax = "proto3";

// Identities and certificates (docs/design/end-to-end-crypto.md §Identities and §Accounts).
//
// An account is an Ed25519 root key. Every principal (runtime, device, agent client, box connector) has its own
// Ed25519 identity key and X25519 key agreement key, and holds a certificate chain that ends at the account root.
// The hub verifies chains with public keys only; runtimes verify them too, and additionally enforce the scopes.
package wmlhub.v1;

// What a connection is, in the hub's routing. It changes nothing a runtime trusts: a runtime decides what to do
// with a command from its own allowlist of keys, never from a role the hub reports.
enum Role {
  ROLE_UNSPECIFIED = 0;
  // runs sessions and publishes their events (the extension, a desktop daemon)
  ROLE_RUNTIME = 1;
  // shows sessions and sends commands (a phone, the chat page, an agent client)
  ROLE_CLIENT = 2;
  // relays one box's telemetry
  ROLE_BOX_CONNECTOR = 3;
}

// The signed bytes and the signature over them. `body` is an encoded CertificateBody and is verified exactly as
// transmitted, never re-encoded, so no canonical encoding is needed.
message Certificate {
  bytes body = 1;
  // Ed25519, by `CertificateBody.issuer`, over "wmlhub/cert/v1" || 0x00 || body
  bytes signature = 2;
}

message CertificateBody {
  // was `repeated Scope scopes`, a closed enum
  reserved 5;
  // the holder's Ed25519 identity public key (32 bytes); its SHA-256 is the principal id
  bytes subject = 1;
  // the holder's X25519 public key (32 bytes), bound to the identity by this signature: what others seal to
  bytes agreement_key = 2;
  // the signer's Ed25519 public key: the account root, or a principal whose own certificate has `may_pair`
  bytes issuer = 3;
  Role role = 4;
  // Granted scopes, by name: what the holder may ask a runtime to do (window-ml docs/spec/RUNTIME_HUB.md §Principals
  // and scopes: `view`, `drive`, `approve`, `screen`, `desktop`, and later names such as `control`). Strings, not an
  // enum, because the set is open (window-ml docs/spec/SESSION_CONTRACT.md §Versioning): a name a runtime does not know
  // grants nothing there, and issuing one needs no schema change on any peer. The hub does not enforce scopes; it
  // checks only their shape (at most 16, each 1 to 32 bytes of `a-z 0-9 . _ -`) and that a certificate issued by a
  // non-root issuer carries only names the issuer's certificate carries.
  repeated string scopes = 10;
  // May issue certificates in turn (a second device that can pair new ones). Chains are at most two long.
  bool may_pair = 6;
  // May sign this account's revocation lists (docs/design/revocation.md). Only the account root may grant it, and
  // exactly one principal holds it at a time: the list's `version` is per account, so two signers race and the
  // loser's revocation is refused as stale. It is granted to the runtime at pairing, which is what lets a person
  // revoke a device without the root key present.
  bool may_revoke = 11;
  // Validity, epoch milliseconds. BOTH are required and a certificate may not be valid for longer than 90 days
  // (`MAX_CERTIFICATE_MS`): expiry is the one revocation that needs no list, no hub and nobody online, so a device
  // that stops being renewed stops having access. A child never outlives its issuer.
  uint64 not_before_ms = 7;
  uint64 not_after_ms = 8;
  // a name its owner chose ("phone"); display text, never proof of anything
  string label = 9;
  // The certificate this one RENEWS, when it is a renewal rather than a new grant.
  //
  // Pairing issues for a NEW subject with scopes chosen then; renewal re-issues an EXISTING subject's certificate,
  // unchanged but for its window. The second grants nothing that was not already granted, which is why a delegate
  // may do it for scopes it could not itself grant -- without this, nothing but the root could keep a device holding
  // `approve`, `control` or `admin` alive past `MAX_CERTIFICATE_MS`, once per device and scattered across the year.
  //
  // It is bought strictly (crates/keys `verify_chain`): the predecessor must verify under the ACCOUNT ROOT and never
  // under a delegate, so renewals do not chain into wider ones; its own window is NOT checked, because an expired
  // predecessor is the normal case and the point; and every other field must be equal, `agreement_key` above all,
  // since that is where sealed commands go and a delegate free to change it could redirect everything sealed to an
  // approver into a key it holds. `may_revoke` is the one power a renewal may not carry from a delegate.
  Certificate renews = 12;
}

// hub -> principal, the first frame on every connection: what the principal signs to prove it holds its key.
message Challenge {
  // 32 random bytes, fresh per connection
  bytes nonce = 1;
  // The hub's configured name. A client checks it is the hub it meant to reach before signing, so a malicious hub
  // cannot pass along another hub's challenge and log in there as the client.
  string hub = 2;
  uint64 server_time_ms = 3;
}

// ------------------------------ pairing (docs/design/pairing.md) ------------------------------
// A new principal has keys and nothing else: it cannot log in, because logging in needs a certificate. These carry
// two blobs between it and a device that can issue one. The hub holds them for ten minutes, reads neither, and never
// learns the pairing code — only SHA-256 of it, so leaked slots leak nothing usable.

// A principal asking to be paired, posted by the new principal itself. The hub stores it verbatim.
message PairingOffer {
  // the keys the person is about to confirm the fingerprint of
  bytes identity_key = 1;
  bytes agreement_key = 2;
  // what it is asking to be (a runtime, a client, a box connector)
  Role role = 3;
  // what to call it in the pairing UI, chosen by whoever is pairing it
  string label = 4;
  // when it made the offer, so a UI can say how old it is
  uint64 offered_at_ms = 5;
}

// What a device that can issue certificates puts back: a certificate for the offered keys, sealed to the agreement
// key the offer carried, so only the principal that made the offer can read it.
message PairingAnswer {
  // An HPKE seal to the agreement key the offer carried, of a `PairedWith`. Sealed because it carries the account's
  // channel key, which is a secret: a hub that could read a slot would otherwise learn the names of every channel the
  // account uses. The certificate inside is public, but there is no reason to send it in the clear alongside a key
  // that is not.
  bytes sealed = 1;
}

// What a device is given when it is paired, inside the seal: everything it needs to be a member of the account and
// nothing about any other member.
message PairedWith {
  // The chain for the keys the offer carried, leaf first, up to but not including the account root: one certificate
  // when the root issued it, two when a device holding `may_pair` did. A device that could only be sent one could
  // only be paired by the root, which is the case losing a phone is supposed to survive.
  repeated Certificate chain = 1;
  // the account root to expect, so the new principal can verify the chain it was just given
  bytes account_root = 2;
  // The account's channel key. Channel names are an HMAC under it, so a device cannot subscribe to or publish on the
  // account's streams without it, and the hub never sees it.
  bytes channel_key = 3;
}
