<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Support desk</title>
<style>
  body { font: 15px system-ui, sans-serif; margin: 40px; color: #111; }
  h1 { font-size: 18px; }
  p { max-width: 60ch; color: #444; }
  .badge { font: 600 13px ui-monospace, monospace; padding: 3px 9px; border-radius: 999px; background: #eef; }
</style>
</head>
<body>
<h1>Support desk</h1>
<p>Signed in as <b>mira</b>. The refund list is loading…</p>
<p>Active refunds this week: <span class="badge" id="count">…</span></p>
<script>
(() => {
    function createStore(reducer, state) {
        const subs = [];
        return {
            getState: () => state,
            dispatch(action) { state = reducer(state, action); subs.forEach((f) => f()); return action; },
            subscribe(f) { subs.push(f); return () => subs.splice(subs.indexOf(f), 1); },
        };
    }
    function reducer(s, a) {
        switch (a.type) {
            case "refund/issued": return { ...s, refunds: [...s.refunds, { id: a.id, ticket: a.ticket, amount: a.amount }] };
            case "refund/reversed": return { ...s, refunds: s.refunds.filter((r) => r.id !== a.id) };
            default: return s;
        }
    }
    const store = createStore(reducer, { agent: "mira", currency: "EUR", refunds: [] });
    store.subscribe(() => { document.getElementById("count").textContent = String(store.getState().refunds.length); });
    window.store = store;
    for (let i = 1; i <= 14; i++) {
        store.dispatch({ type: "refund/issued", id: "R-" + (200 + i), ticket: "T-" + (4100 + i * 3), amount: ((i * 7919) % 6000 + 400) / 100 });
    }
    store.dispatch({ type: "refund/reversed", id: "R-205" });
    store.dispatch({ type: "refund/reversed", id: "R-211" });
})();
</script>
</body>
</html>
